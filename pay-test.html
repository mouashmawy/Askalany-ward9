<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Make a test campaign donation through PayPal.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#062d59">
  <title>PayPal Donation Test | Mohamed Askalany for Ward 9</title>
  <link rel="icon" type="image/webp" href="images/Askalany Logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261012">
</head>
<body data-page="pay-test">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="paypal-test-main">
    <section class="paypal-donation-section" aria-labelledby="paypal-donation-heading">
      <span class="paypal-background-nine" aria-hidden="true">9</span>
      <div class="container">
        <div class="paypal-donation-card">
          <div class="paypal-brand">
            <img src="images/paypal-logo.png" alt="PayPal" width="258" height="258">
            <span>PayPal</span>
          </div>

          <p class="eyebrow">Support the campaign</p>
          <h1 id="paypal-donation-heading">Make a donation with PayPal.</h1>
          <p class="paypal-intro">Choose an amount in Canadian dollars.</p>

          <div class="paypal-amount-options" aria-label="Choose a donation amount">
            <a class="paypal-amount-button" href="https://paypal.me/mmashraf9/10CAD">
              <span>$10</span><small>CAD</small>
            </a>
            <a class="paypal-amount-button" href="https://paypal.me/mmashraf9/20CAD">
              <span>$20</span><small>CAD</small>
            </a>
            <a class="paypal-amount-button" href="https://paypal.me/mmashraf9/50CAD">
              <span>$50</span><small>CAD</small>
            </a>
            <a class="paypal-amount-button" href="https://paypal.me/mmashraf9/100CAD">
              <span>$100</span><small>CAD</small>
            </a>
            <button class="paypal-amount-button paypal-custom-toggle" type="button" aria-expanded="false" aria-controls="paypal-custom-form">
              <span>Custom</span><small>Up to $1,000</small>
            </button>
          </div>

          <form class="paypal-custom-form" id="paypal-custom-form" hidden novalidate>
            <label for="paypal-custom-amount">Enter a custom amount</label>
            <div class="paypal-custom-row">
              <div class="paypal-amount-field">
                <span aria-hidden="true">$</span>
                <input id="paypal-custom-amount" name="amount" type="number" min="0.01" max="1000" step="0.01" inputmode="decimal" placeholder="0.00" required aria-describedby="paypal-custom-help paypal-custom-status">
                <strong>CAD</strong>
              </div>
              <button class="btn btn-primary" type="submit">Continue to PayPal <span aria-hidden="true">↗</span></button>
            </div>
            <p id="paypal-custom-help" class="paypal-custom-help">Maximum custom donation: $1,000 CAD.</p>
            <p id="paypal-custom-status" class="paypal-custom-status" role="alert"></p>
          </form>

          <p class="paypal-notice">You will continue to PayPal to complete your donation.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="script.js?v=20261012"></script>
  <script src="pay-test.js?v=20261012"></script>
</body>
</html>
